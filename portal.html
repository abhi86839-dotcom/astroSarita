<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Lessons | Astro Sarita</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="nav.css"><link rel="stylesheet" href="style.css">
</head><body>
<header class="nav"><div class="wrap"><a class="brand" href="index.html"><span>🪐</span><b>Astro Sarita</b></a><nav class="links"><a href="index.html" >Courses</a><a href="varshphal.html" >Varshphal</a><a href="janam-kundali.html">Janam Kundali</a><a href="dictums.html">Dictums</a></nav></div></header>
<main class="wrap">
  <a class="crumb" href="index.html">← Back to Sections</a>
  <section class="hero" style="padding:14px 0 10px;text-align:left">
    <h1 id="sectionTitle" style="font-size:clamp(1.6rem,4vw,2.3rem)">Course Lessons</h1>
    <p id="sectionDesc" style="margin:0"></p>
  </section>

  <section id="videoPlayer" class="card player" aria-live="polite">
    <div class="frame"><iframe id="videoFrame" title="Lesson video" src="" allow="accelerometer;autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>
    <h2 id="videoTitle"></h2><p id="videoDesc"></p>
    <div class="pnav"><button class="btn ghost" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div>
  </section>

  <div id="contentArea"></div>
  <div id="msg" class="msg" role="status"></div>
</main>
<footer>© 2026 Astro Sarita Learning Portal</footer>
<script src="lessons-data.js"></script>
<script>
const area=document.getElementById('contentArea'),msg=document.getElementById('msg');
const q=new URLSearchParams(location.search);
let lessons=[],cur=-1;

function play(i){
  if(i<0||i>=lessons.length)return;cur=i;const l=lessons[i];
  document.getElementById('videoTitle').textContent=l.title||'';
  document.getElementById('videoDesc').textContent=l.description||('Duration: '+(l.duration||'30:00'));
  document.getElementById('videoFrame').src='https://www.youtube.com/embed/'+encodeURIComponent(l.videoId)+'?autoplay=1';
  const p=document.getElementById('videoPlayer');p.classList.add('active');p.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.lesson').forEach((el,k)=>el.classList.toggle('on',k===i));
  document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===lessons.length-1;
}
document.getElementById('prev').onclick=()=>play(cur-1);
document.getElementById('next').onclick=()=>play(cur+1);

function sectionList(sections){
  document.getElementById('sectionTitle').textContent='Select Section';
  document.getElementById('sectionDesc').textContent='Choose a section to view its lessons.';
  const g=document.createElement('div');g.className='grid';
  sections.forEach((s,i)=>{const a=document.createElement('a');a.className='card tile';a.href='?sectionIndex='+i;
    a.innerHTML='<span class="ic">📖</span><h3></h3><p></p>';a.querySelector('h3').textContent=s.title;
    a.querySelector('p').textContent=(s.lessons||[]).length+' lessons';g.appendChild(a)});
  area.appendChild(g);
}

loadLessons().then(data=>{
  if(!data||!Array.isArray(data.sections)){msg.textContent='lessons.json format error: expected sections array.';return}
  const S=data.sections;let active=null;
  const idx=q.get('sectionIndex'),sec=q.get('section');
  if(idx!==null){const i=parseInt(idx,10);if(S[i])active=S[i]}
  else if(sec){const n=parseInt(sec,10);active=(!isNaN(n)&&S[n])?S[n]:S.find(s=>(s.title||'').toLowerCase()===sec.toLowerCase())}
  if(!active){sectionList(S);return}
  document.title=(active.title||'Section')+' | Astro Sarita';
  document.getElementById('sectionTitle').textContent=active.title||'Section';
  document.getElementById('sectionDesc').textContent=active.description||((active.lessons||[]).length+' lessons');
  lessons=active.lessons||[];
  const g=document.createElement('div');g.className='lessons';
  lessons.forEach((l,i)=>{const b=document.createElement('button');b.className='lesson';
    b.innerHTML='<span class="n"></span><span><b></b><small></small></span>';
    b.querySelector('.n').textContent=i+1;b.querySelector('b').textContent=l.title||'Untitled';
    b.querySelector('small').textContent=l.description||('⏱ '+(l.duration||'30:00'));
    b.onclick=()=>play(i);g.appendChild(b)});
  area.appendChild(g);
}).catch(e=>{msg.textContent='Error loading lessons.json. Open console for details.';console.error(e)});
</script>
</body></html>
